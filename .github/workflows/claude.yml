# VVB @claude v0.1. Bara OWNER. Får pusha till PR-/feature-branch, aldrig main (ruleset).
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  claude:
    if: >
      (github.event.comment.author_association == 'OWNER' || github.event.issue.author_association == 'OWNER')
      && contains(github.event.comment.body || github.event.issue.body, '@claude')
      && !startsWith(github.event.comment.body, '@claude gate')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh api repos/*/pulls/*/comments:*),Bash(gh api repos/*/pulls/*/reviews:*),Bash(gh api repos/*/issues/*/comments:*),Edit,Write,MultiEdit,Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD:*),Bash(git status:*),Bash(git diff:*),Bash(npm test:*),Bash(npm run lint:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(git push --force:*),Bash(git push -f:*)"
