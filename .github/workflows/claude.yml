# VVB @claude v0.2. Bara OWNER (avsändaren av kommentaren). Commits via signerad file-ops-tool till aktuell branch, ingen rå git push.
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read
jobs:
  claude:
    if: >
      (github.event_name == 'issues'
        && github.event.issue.author_association == 'OWNER'
        && contains(github.event.issue.body, '@claude'))
      || (github.event_name != 'issues'
        && github.event.comment.author_association == 'OWNER'
        && contains(github.event.comment.body, '@claude')
        && !startsWith(github.event.comment.body, '@claude gate'))
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checka ut PR-head
        if: github.event.issue.pull_request || github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          # Bara PR:er från samma repo (aldrig fork-kod med secrets + skrivtoken)
          test "$(gh pr view "$N" --json isCrossRepository -q .isCrossRepository)" = "false" || { echo "Fork-PR: avbryter"; exit 1; }
          gh pr checkout "$N"
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          use_commit_signing: true
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Edit,Write,MultiEdit,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(npm test:*),Bash(npm run test:*),Bash(npm run lint:*),Bash(node --test:*),Bash(pnpm test:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(git push:*),Bash(gh api:*),Bash(gh pr merge:*),Bash(gh pr review:*)"
