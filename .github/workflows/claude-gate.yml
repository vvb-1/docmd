# VVB Claude-gate v0.1. Read-only dom på exakt head. Merge kräver alltid Kristians OK.
name: Claude Gate
on:
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created]
concurrency:
  group: claude-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  gate:
    if: >
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.author_association == 'OWNER'
        && startsWith(github.event.comment.body, '@claude gate'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: model
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "$BODY" == "@claude gate opus"* ]]; then echo "m=claude-opus-5-5" >> "$GITHUB_OUTPUT"; else echo "m=claude-sonnet-5-5" >> "$GITHUB_OUTPUT"; fi
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || github.event.issue.number }}
            Du är VVB Claude-gate. Följ CLAUDE.md, avsnittet "VVB GATE", exakt.
          claude_args: |
            --model ${{ steps.model.outputs.m }}
            --max-turns 12
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh api repos/*/pulls/*/comments:*),Bash(gh api repos/*/pulls/*/reviews:*),Bash(gh api repos/*/issues/*/comments:*)"
            --disallowedTools "Write,Edit,MultiEdit,WebFetch,WebSearch"
